name: Build & Release Android APK - ইমন স্টোর (Imon Store)

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android Debug & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Node Dependencies
        run: npm install --legacy-peer-deps

      - name: Run Automated Test Suite
        run: npm run test

      - name: Build Web Application
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Make Gradlew Executable
        run: chmod +x android/gradlew

      - name: Build Android Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace

      - name: Verify APK Generated
        run: |
          ls -la android/app/build/outputs/apk/debug/
          test -f android/app/build/outputs/apk/debug/app-debug.apk
          echo "APK generated successfully: $(du -h android/app/build/outputs/apk/debug/app-debug.apk)"

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: imon-store-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release and Attach APK (on Release/Tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/debug/app-debug.apk
          name: Release ${{ github.ref_name }} - ইমন স্টোর APK
          body: |
            ## 📱 ইমন স্টোর (Imon Store) - Android APK

            অ্যান্ড্রয়েড ফোনের জন্য ইমন স্টোর অ্যাপের ইনস্টলেশন ফাইল (APK)।

            ### বৈশিষ্ট্যসমূহ:
            - 🇧🇩 সম্পূর্ণ বাংলা ইন্টারফেস ও টাকা (৳) কারেন্সি
            - 📦 স্টক ও ইনভেন্টরি ট্র্যাকিং এবং কম স্টক অ্যালার্ট
            - 📒 খাতা: বাকি দিলাম, বাকি পেলাম, নগদ বিক্রি, খরচ ও ফেরত
            - 🔗 কাস্টমার শেয়ারযোগ্য স্টেটমেন্ট লিংক (হিসাবের রসিদ)
            - 🎙️ বাংলা ভয়েস হিসাব ও অডিও মেসেজ
            - 🔒 নিরাপদ ৪-ডিজিটের পিন লক ও ব্যাকআপ
          draft: false
          prerelease: false
