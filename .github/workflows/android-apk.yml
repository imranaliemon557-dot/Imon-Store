name: Build & Release Android APK - ইমন স্টোর
on:
  push:
    branches: [ "main", "master" ]
    tags:
      - 'v*'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-apk:
    name: Build Android Debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Install Dependencies
        run: npm ci --legacy-peer-deps || npm install --legacy-peer-deps
      - name: Build Web Application
        run: npm run build
      - name: Create local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > android/local.properties
      - name: Sync Capacitor Android
        run: npx cap sync android || true
      - name: Build Android Debug APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug --stacktrace
      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: imon-store-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
